[project]
name = "eci-tools"
version = "0.0.1"
description = "Authoring tools for Expanded Character Interactions (Stardew Valley mod)"
requires-python = ">=3.10"
# PyYAML is the only runtime dependency — analyze_voice.py is pure
# stdlib, and the build/lint/simulator tools only need YAML parsing.
dependencies = [
    "pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"
