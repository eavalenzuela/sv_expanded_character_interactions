# Smoke-test dialogue for Robin — used to validate the ECI pipeline
# end-to-end. Robin stands at the Carpenter's Shop counter most days
# from 9 AM, so she's accessible without any friendship gate.
#
# After running build_cp.py, talking to Robin should show one of these
# lines instead of her vanilla weekday dialogue.

npc: Robin

lines:
  # Always-true sentinel — confirms the pipeline works at all.
  # If this never appears when you talk to Robin, we have a load-order,
  # CP-syntax, or token-resolution bug.
  - id: robin_eci_sentinel
    text: "[ECI sentinel] If you see this, the ECI content pack is loading and overriding my dialogue. Try `patch summary` in the SMAPI console for details."

  # Custom-token check — should appear if you've chopped a tree today.
  - id: robin_chopped_callback
    when:
      "eavalenzuela.ECI.Tokens/PlayerDidToday": choppedTree
    text: "[ECI test] Hey, you've been swinging that axe today, huh?"

  # Time-bucket check — should appear after 7 PM.
  - id: robin_late_evening
    when:
      "eavalenzuela.ECI.Tokens/TimeOfDayBucket": late
    text: "[ECI test] You're up late, friend."
