# Leah dialogue. Organized by axis.
#
# Schema:
#   npc:        string
#   lines[]:
#     id:          unique string (used as CP LogName)
#     target_key:  string | list | "*" (default "*" = all 7 base weekdays)
#                  Macros: "*" = Mon..Sun
#                          "any_day" = Mon..Sun + <season>_<weekday> for
#                                      summer/fall/winter (28 keys)
#     when:        map of CP token name → value (ANDed)
#     text:        string (Stardew dialogue; may use $h/$e/etc.)
#
# ORDERING RULE (load-order matters!):
#   CP applies EditData patches in YAML order; last write wins. So
#   *more-specific* lines (multi-axis Whens) must appear *later* than
#   less-specific ones, so they overwrite the catch-all on the few
#   contexts where both match.
#
# Targeting strategy:
#   - Spring: Leah has no vanilla `spring_<weekday>` keys → target plain
#     `Mon..Sun` and add `when.Season: Spring`.
#   - Summer/Fall/Winter: vanilla covers `<season>_<weekday>`, so target
#     those directly. No Season When needed (key implies season).

npc: Leah

lines:
  # =====================================================================
  # AXIS: season — 1-axis baselines
  # =====================================================================

  # ---- Spring (no vanilla spring_<weekday> → plain weekdays + Season When) ----
  - id: leah_season_spring_pine
    target_key: [Mon, Wed, Fri]
    when:
      Season: Spring
    text: "Mmm — smells like wet wood and pine sap. The forest's waking up.$h"

  - id: leah_season_spring_forage
    target_key: [Tue, Thu, Sat, Sun]
    when:
      Season: Spring
    text: "I came home covered in mud. Worth it — the spring foraging is wild this year."

  # ---- Summer ----
  - id: leah_season_summer_herbs
    target_key: [summer_Mon, summer_Wed, summer_Fri]
    text: "It's almost too warm to work. I've been hauling water and hanging herbs to dry instead."

  - id: leah_season_summer_thyme
    target_key: [summer_Tue, summer_Thu, summer_Sat, summer_Sun]
    text: "Mmm — found a whole patch of wild thyme this morning. Going to make pasta with it tonight.$h"

  # ---- Fall ----
  - id: leah_season_fall_light
    target_key: [fall_Mon, fall_Wed, fall_Fri]
    text: "The light's so different now. I keep wanting to capture how the leaves turn translucent at sunset."

  - id: leah_season_fall_mushrooms
    target_key: [fall_Tue, fall_Thu, fall_Sat, fall_Sun]
    text: "Mushrooms everywhere right now. I've been adding them to almost everything I cook."

  # ---- Winter ----
  - id: leah_season_winter_slow
    target_key: [winter_Mon, winter_Wed, winter_Fri]
    text: "I love how slow winter goes. Time stretches when you can't rush anywhere outside.$h"

  - id: leah_season_winter_carve
    target_key: [winter_Tue, winter_Thu, winter_Sat, winter_Sun]
    text: "There's something about the way snow rests on bare wood. Makes me want to carve simpler shapes."

  # =====================================================================
  # AXIS: weather — 1-axis baselines (any_day = 28 keys)
  # =====================================================================

  - id: leah_weather_rain_smells
    target_key: any_day
    when:
      Weather: Rain
    text: "Mmm — the rain pulls everything's smell out at once. Earth, leaves, even the wood's been waiting for this."

  - id: leah_weather_storm_cabin
    target_key: any_day
    when:
      Weather: Storm
    text: "Storms make the cabin feel small in a good way. I've just been sitting and watching."

  - id: leah_weather_snow_simplify
    # Snow only happens in winter, so just target winter_<weekday>.
    target_key: [winter_Mon, winter_Tue, winter_Wed, winter_Thu, winter_Fri, winter_Sat, winter_Sun]
    when:
      Weather: Snow
    text: "Everything's outlined in snow. I've been sketching today instead of carving — the shapes already simplified themselves."

  - id: leah_weather_wind_unsettled
    target_key: any_day
    when:
      Weather: Wind
    text: "The wind keeps moving things. Hard to focus on anything that wants to stay still."

  - id: leah_weather_greenrain_moss
    # GreenRain only in summer (canon dates); spring + summer keys cover it.
    target_key: [Mon, Tue, Wed, Thu, Fri, Sat, Sun,
                 summer_Mon, summer_Tue, summer_Wed, summer_Thu, summer_Fri, summer_Sat, summer_Sun]
    when:
      Weather: GreenRain
    text: "Green rain... I keep wanting to know what the moss feels like underfoot. Soft, I think. Like wool."

  # =====================================================================
  # AXIS: time-of-day — 1-axis baselines (6 lines)
  # Buckets: morning (≤11:00), midday (11–15), evening (15–19), late (19+).
  # Placed BEFORE location/recent-action so those win on overlap (location
  # feels more "in the moment" than ambient time mood).
  # =====================================================================

  - id: leah_time_morning_coffee
    target_key: [Mon, Wed, Fri,
                 summer_Mon, summer_Wed, summer_Fri,
                 fall_Mon, fall_Wed, fall_Fri,
                 winter_Mon, winter_Wed, winter_Fri]
    when:
      "eavalenzuela.ECI.Tokens/TimeOfDayBucket": morning
    text: "Mm — I haven't had my coffee yet. Brain's still loose."

  - id: leah_time_morning_quiet
    target_key: [Tue, Thu, Sat, Sun,
                 summer_Tue, summer_Thu, summer_Sat, summer_Sun,
                 fall_Tue, fall_Thu, fall_Sat, fall_Sun,
                 winter_Tue, winter_Thu, winter_Sat, winter_Sun]
    when:
      "eavalenzuela.ECI.Tokens/TimeOfDayBucket": morning
    text: "The first hour after waking is for thinking. Before words start being asked of me."

  - id: leah_time_midday_lunch
    target_key: any_day
    when:
      "eavalenzuela.ECI.Tokens/TimeOfDayBucket": midday
    text: "Lunchtime brain. Trying to convince myself a sandwich isn't an interruption."

  - id: leah_time_evening_gold
    target_key: any_day
    when:
      "eavalenzuela.ECI.Tokens/TimeOfDayBucket": evening
    text: "I usually quit by now. The light goes gold and I just want to look at things instead of making them.$h"

  - id: leah_time_late_frog
    target_key: [Mon, Wed, Fri,
                 summer_Mon, summer_Wed, summer_Fri,
                 fall_Mon, fall_Wed, fall_Fri,
                 winter_Mon, winter_Wed, winter_Fri]
    when:
      "eavalenzuela.ECI.Tokens/TimeOfDayBucket": late
    text: "There's a frog out by the river that only sings this late. I keep finding excuses to be near it."

  - id: leah_time_late_varnish
    target_key: [Tue, Thu, Sat, Sun,
                 summer_Tue, summer_Thu, summer_Sat, summer_Sun,
                 fall_Tue, fall_Thu, fall_Sat, fall_Sun,
                 winter_Tue, winter_Thu, winter_Sat, winter_Sun]
    when:
      "eavalenzuela.ECI.Tokens/TimeOfDayBucket": late
    text: "Mmm... late visit. I should head home soon — I varnished a piece today and the wood's probably still tacky."

  # =====================================================================
  # AXIS: day-of-week — 1-axis baselines (6 lines, one per weekday except
  # Tuesday). Placed after time so DOW shadows time on these weekdays;
  # placed before location so location overrides win on shared contexts.
  # Tuesday intentionally skipped so time-of-day lines still fire then.
  # =====================================================================

  - id: leah_dow_mon_start
    target_key: [Mon, summer_Mon, fall_Mon, winter_Mon]
    text: "Mondays. A new sketchbook page. Anything could happen, statistically."

  - id: leah_dow_wed_midweek
    target_key: [Wed, summer_Wed, fall_Wed, winter_Wed]
    text: "Mid-week. The piece I was sure about on Monday is already wrong."

  - id: leah_dow_thu_gallery
    target_key: [Thu, summer_Thu, fall_Thu, winter_Thu]
    text: "Thursdays I deliver to the gallery if I have anything ready. Not this week — I'm hoarding."

  - id: leah_dow_fri_almost
    target_key: [Fri, summer_Fri, fall_Fri, winter_Fri]
    text: "Friday. I keep promising myself Saturdays off. I keep breaking it.$h"

  - id: leah_dow_sat_market
    target_key: [Sat, summer_Sat, fall_Sat, winter_Sat]
    text: "Saturdays. I sold three pieces at last week's market — already trying not to ruin the streak."

  - id: leah_dow_sun_quiet
    target_key: [Sun, summer_Sun, fall_Sun, winter_Sun]
    text: "Sundays in the cabin are the slowest pace I let myself work at."

  # =====================================================================
  # AXIS: location — 1-axis baselines (8 lines, distributed)
  # =====================================================================

  # ---- Forest (her primary outdoor habitat — 2 lines, day-split) ----
  - id: leah_loc_forest_beetle
    target_key: [Mon, Wed, Fri,
                 summer_Mon, summer_Wed, summer_Fri,
                 fall_Mon, fall_Wed, fall_Fri,
                 winter_Mon, winter_Wed, winter_Fri]
    when:
      LocationName: Forest
    text: "Lost half the morning watching a beetle hollow out a log. Couldn't help it — the texture was unbelievable."

  - id: leah_loc_forest_quiet
    target_key: [Tue, Thu, Sat, Sun,
                 summer_Tue, summer_Thu, summer_Sat, summer_Sun,
                 fall_Tue, fall_Thu, fall_Sat, fall_Sun,
                 winter_Tue, winter_Thu, winter_Sat, winter_Sun]
    when:
      LocationName: Forest
    text: "This part of the forest holds the quiet better. I think the moss eats the sound."

  # ---- LeahHouse (her cabin — 2 lines, day-split) ----
  - id: leah_loc_cabin_bread
    target_key: [Mon, Wed, Fri,
                 summer_Mon, summer_Wed, summer_Fri,
                 fall_Mon, fall_Wed, fall_Fri,
                 winter_Mon, winter_Wed, winter_Fri]
    when:
      LocationName: LeahHouse
    text: "Come in — I was just pulling bread from the stove. Cabin smells like a bakery for once, instead of wood shavings."

  - id: leah_loc_cabin_afternoon
    target_key: [Tue, Thu, Sat, Sun,
                 summer_Tue, summer_Thu, summer_Sat, summer_Sun,
                 fall_Tue, fall_Thu, fall_Sat, fall_Sun,
                 winter_Tue, winter_Thu, winter_Sat, winter_Sun]
    when:
      LocationName: LeahHouse
    text: "The light hits the back wall in the late afternoon. I time the fine work for it."

  # ---- Single-line locations ----
  - id: leah_loc_town_pretty
    target_key: any_day
    when:
      LocationName: Town
    text: "Pelican Town's prettier than I remember. Maybe I just don't come here enough."

  # Vanilla has a `Beach` location-key for Leah, which Stardew picks
  # BEFORE weekday selection. We must target that key directly to override.
  - id: leah_loc_beach_motion
    target_key: Beach
    text: "Mmm — I keep coming back to the way the sand sucks back when a wave pulls. Pure motion."

  - id: leah_loc_mountain_stone
    target_key: any_day
    when:
      LocationName: Mountain
    text: "The stone up here's a totally different temperature than the wood I work with. Cold and certain."

  - id: leah_loc_saloon_soup
    target_key: any_day
    when:
      LocationName: Saloon
    text: "Gus's vegetable soup is the only reason I come in for the noise. Honestly worth it.$h"

  # =====================================================================
  # AXIS: recent player action (custom token PlayerDidToday)
  # 8 lines covering 5 flags: choppedTree, caughtFish, gaveGift,
  # enteredMine, passedOut. Higher-priority flags listed last so they
  # win on rare multi-flag days (passedOut > enteredMine > the rest).
  # Same-flag variance via Mon/Wed/Fri vs Tue/Thu/Sat/Sun day-split.
  # =====================================================================

  # ---- choppedTree (2 lines, day-split) ----
  - id: leah_did_chopped_callback
    target_key: [Mon, Wed, Fri,
                 summer_Mon, summer_Wed, summer_Fri,
                 fall_Mon, fall_Wed, fall_Fri,
                 winter_Mon, winter_Wed, winter_Fri]
    when:
      "eavalenzuela.ECI.Tokens/PlayerDidToday": choppedTree
    text: "I heard you out there with the axe today. Did the wood split clean?"

  - id: leah_did_chopped_sap
    target_key: [Tue, Thu, Sat, Sun,
                 summer_Tue, summer_Thu, summer_Sat, summer_Sun,
                 fall_Tue, fall_Thu, fall_Sat, fall_Sun,
                 winter_Tue, winter_Thu, winter_Sat, winter_Sun]
    when:
      "eavalenzuela.ECI.Tokens/PlayerDidToday": choppedTree
    text: "You came by smelling like fresh-cut sap. Lost in the wood today?$h"

  # ---- caughtFish (2 lines, day-split) ----
  - id: leah_did_fish_smell
    target_key: [Mon, Wed, Fri,
                 summer_Mon, summer_Wed, summer_Fri,
                 fall_Mon, fall_Wed, fall_Fri,
                 winter_Mon, winter_Wed, winter_Fri]
    when:
      "eavalenzuela.ECI.Tokens/PlayerDidToday": caughtFish
    text: "Mmm — you've been by the water today. Salt and that one specific kind of mud."

  - id: leah_did_fish_reflection
    target_key: [Tue, Thu, Sat, Sun,
                 summer_Tue, summer_Thu, summer_Sat, summer_Sun,
                 fall_Tue, fall_Thu, fall_Sat, fall_Sun,
                 winter_Tue, winter_Thu, winter_Sat, winter_Sun]
    when:
      "eavalenzuela.ECI.Tokens/PlayerDidToday": caughtFish
    text: "Out fishing today? I tried it once. Mostly caught my own reflection."

  # ---- gaveGift (1 line — recipient unspecified by token) ----
  - id: leah_did_gift_collect
    target_key: any_day
    when:
      "eavalenzuela.ECI.Tokens/PlayerDidToday": gaveGift
    text: "Heard you brought someone a gift today. Small things like that — they collect over time."

  # ---- enteredMine (1 line) ----
  - id: leah_did_mine_dust
    target_key: any_day
    when:
      "eavalenzuela.ECI.Tokens/PlayerDidToday": enteredMine
    text: "You've got a different look about you today. The mines, maybe? They leave a kind of dust on people."

  # ---- passedOut (1 line, last so it wins on rare multi-flag days) ----
  - id: leah_did_passedout_rest
    target_key: any_day
    when:
      "eavalenzuela.ECI.Tokens/PlayerDidToday": passedOut
    text: "I heard you passed out somewhere recently. Take it easier — sleep is part of the work, too."

  # =====================================================================
  # PILLAR 2 ONRAMP: branching dialogue + multi-axis affinity
  # Stardew $q/$r syntax. Response IDs (leah_q_art_yes / _maybe / _no)
  # are mapped to per-axis affinity deltas in ECI.Tokens/responses.json.
  # When the player picks an answer, ECI.Tokens's UpdateTicked hook
  # detects the new entry in dialogueQuestionsAnswered and applies the
  # configured deltas to Leah's Trust/Respect/Romance axes.
  # =====================================================================

  # Smoke test: at LeahHouse, Leah asks the player about her current
  # piece. Choices test all three sign cases (positive, neutral, negative).
  # build_cp.py expands `question:` into Stardew $q/$r syntax and
  # registers the response→affinity-deltas mapping in responses.json.
  - id: leah_q_art_branching
    target_key: any_day
    when:
      LocationName: LeahHouse
    question:
      id: 1601
      text: "Want to see what I'm working on?"
      responses:
        - id: leah_q_art_yes
          text: "Yes, I'd love to."
          followup: "Come on then — it's just over here. Watch the chips on the floor."
          affinity:
            Leah: { Trust: 5, Romance: 2 }
        - id: leah_q_art_maybe
          text: "Maybe another time."
          followup: "No worries. Whenever you're curious."
        - id: leah_q_art_no
          text: "Why? It's just rocks."
          followup: "...right. Forget I asked.$s"
          affinity:
            Leah: { Trust: -10, Respect: -5 }

  # Trust-gated follow-up: once Trust ≥ 5, this line takes over the
  # LeahHouse slot — proving the affinity → CP-token → conditional-
  # dialogue loop closes end-to-end. build_cp.py translates the
  # `affinity:` block into a CP {{Query: ...}} entry.
  - id: leah_high_trust_checkin
    target_key: any_day
    when:
      LocationName: LeahHouse
      affinity:
        Leah:
          Trust: ">=5"
    text: "Hey — thanks for asking about my work the other day. It mattered.$h"

  # =====================================================================
  # MULTI-AXIS overrides (more specific → must come AFTER 1-axis lines
  # to win in CP's load-order resolution).
  # =====================================================================

  # weather × location: rainy day in the Forest specifically.
  - id: leah_forest_rain_listen
    target_key: any_day
    when:
      Weather: Rain
      LocationName: Forest
    text: "The rain on the leaves is its own kind of music.$h"

  # time × location: late evening in her cabin.
  - id: leah_late_evening_studio
    target_key: any_day
    when:
      "eavalenzuela.ECI.Tokens/TimeOfDayBucket": late
      LocationName: LeahHouse
    text: "Mmm... I work better when the world's gone quiet. The shapes come easier."

  # season × time × location: winter morning at her cabin.
  - id: leah_winter_morning_warmth
    target_key: [winter_Mon, winter_Tue, winter_Wed, winter_Thu, winter_Fri, winter_Sat, winter_Sun]
    when:
      "eavalenzuela.ECI.Tokens/TimeOfDayBucket": morning
      LocationName: LeahHouse
    text: "Mmm — the cabin's warmer than I thought it'd be this morning."
