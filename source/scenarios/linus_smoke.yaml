# Runtime smoke scenarios for the test harness.
# Build:  python3 tools/build_scenarios.py
# Run in-game:  eci_runfile scenarios/linus_smoke.json
#
# Each scenario applies a setup (optional), then asserts the top of
# NPC.CurrentDialogue matches text_contains / text_equals /
# text_not_contains.

- name: Linus sentinel fires (assumes already met + Friday in-game)
  setup:
    hearts:
      Linus: 1   # bypass first-meeting Introduction key
  assert:
    npc: Linus
    text_contains: "[ECI sentinel]"

- name: Linus says SOMETHING (sanity)
  assert:
    npc: Linus
    text_contains: ""

- name: Leah sentinel does not leak (no unconditional Leah override)
  setup:
    hearts:
      Leah: 1
  assert:
    npc: Leah
    # Negative assertion: the sentinel line lives in linus.yaml only, so
    # Leah's dialogue must never contain it. (This used to be an
    # intentional always-FAIL via text_contains before the harness had
    # text_not_contains.)
    text_not_contains: "[ECI sentinel]"
