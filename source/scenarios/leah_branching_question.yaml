# Pillar 2 validation, part 1: branching question prompt fires at LeahHouse.
#
# Run (from the SMAPI console):
#   eci_runfile scenarios/leah_branching_question.json
#
# The affinity setup pins Trust below the gate through the ECI.Tokens
# mod API — no manual `eci_affinity set` step needed.
#
# Expected: ✓ pass — top of Leah.CurrentDialogue is the art-question prompt.

- name: "Leah at LeahHouse with Trust<5 — top dialogue is the art-question prompt"
  setup:
    hearts:
      Leah: 2          # past Introduction; not gated by hearts
    affinity:
      Leah: { Trust: 0 }
    warp_player_to: LeahHouse
  assert:
    npc: Leah
    text_contains: "Want to see what I'm working on"
