# Pillar 2 validation, part 2: trust-gated line takes over once Trust ≥ 5.
#
# Run (from the SMAPI console):
#   eci_runfile scenarios/leah_branching_gated.json
#
# The affinity setup runs through the ECI.Tokens mod API, so no manual
# `eci_affinity set` step is needed anymore.
#
# If this fails, the likely cause is CP not re-evaluating the When
# clause because affinity changed mid-frame without an OnTokenChange
# trigger. The setup applies affinity BEFORE the warp so the warp's
# OnLocationChange update sees the new token value; if it still fails,
# warp out (e.g. to Forest) and back to LeahHouse before re-running.

- name: "Leah at LeahHouse with Trust>=5 — top dialogue is the gated checkin"
  setup:
    hearts:
      Leah: 2
    affinity:
      Leah: { Trust: 5 }
    warp_player_to: LeahHouse
  assert:
    npc: Leah
    text_contains: "thanks for asking about my work"
